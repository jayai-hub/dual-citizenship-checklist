/* Layout: a paper-form checklist in one column. Each stage sits beside a large age number in the left margin, ordered by the age at which the step applies. */
:root{
  --bg:#f2f5f9;
  --surface:#ffffff;
  --fg:#14202e;
  --muted:#58667a;
  --line:#d3dbe6;
  --accent:#1f4e8c;
  --accent-soft:#e3ecf8;
  --on-accent:#ffffff;
  --warn:#a4361f;
  --warn-soft:#fbe8e3;
  --caution:#7d5200;
  --caution-soft:#fbf0d7;
  --f-sans:'Noto Sans KR','Noto Sans TC',-apple-system,'Apple SD Gothic Neo','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-serif:'Noto Serif KR','Noto Serif TC','Apple Myungjo','Songti TC',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621;
    --surface:#162131;
    --fg:#e5ebf3;
    --muted:#9aa8ba;
    --line:#2a3748;
    --accent:#86b5ef;
    --accent-soft:#1c2d46;
    --on-accent:#0e1621;
    --warn:#f0917b;
    --warn-soft:#3b211c;
    --caution:#e8c36d;
    --caution-soft:#352c14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621;
  --surface:#162131;
  --fg:#e5ebf3;
  --muted:#9aa8ba;
  --line:#2a3748;
  --accent:#86b5ef;
  --accent-soft:#1c2d46;
  --on-accent:#0e1621;
  --warn:#f0917b;
  --warn-soft:#3b211c;
  --caution:#e8c36d;
  --caution-soft:#352c14;
  color-scheme:dark;
}
html[lang="zh-Hant"]{
  --f-sans:'Noto Sans TC','Noto Sans KR',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-serif:'Noto Serif TC','Noto Serif KR','Songti TC',serif;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-sans);
  font-size:16px;
  line-height:1.65;
  padding-inline:16px;
  padding-block:0 3rem;
}
.page{max-width:46rem;margin-inline:auto}

/* sticky control bar */
.top{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:10;
  background:var(--bg);
  margin-inline:-16px;
  padding:.65rem 16px .6rem;
  border-bottom:1px solid var(--line);
}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{
  font:inherit;font-size:.95rem;font-weight:500;
  min-height:40px;padding:.3rem 1rem;
  border:0;background:transparent;color:var(--fg);cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.prog{display:flex;align-items:center;gap:.75rem;margin-top:.6rem;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}

/* heading */
h1{
  font-family:var(--f-serif);
  font-weight:700;
  font-size:clamp(1.6rem,6vw,2.25rem);
  line-height:1.25;
  text-wrap:balance;
  margin:1.6rem 0 .5rem;
}
.lead{margin:0 0 1.4rem;color:var(--muted);max-width:38rem}

/* stages */
.stage{
  display:grid;
  grid-template-columns:5.75rem minmax(0,1fr);
  column-gap:1rem;
  padding-block:1.4rem;
  border-top:1px solid var(--line);
}
.age{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.big{font-family:var(--f-serif);font-weight:700;font-size:2.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.big.long{font-size:1.65rem;padding-top:.45rem}
.unit{font-size:.82rem;color:var(--muted);margin-top:.4rem}
.stage-body{min-width:0}
.stage h2{font-size:1.05rem;font-weight:700;margin:0 0 .4rem;line-height:1.4;text-wrap:balance}

.items{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:.75rem;
  align-items:start;
  padding:.65rem .6rem;
  border-radius:8px;
  cursor:pointer;
}
.row:hover{background:var(--surface)}
.row input{width:1.3rem;height:1.3rem;margin:.18rem 0 0;accent-color:var(--accent);cursor:pointer}
.row input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.done .txt{color:var(--muted)}
.txt{min-width:0;overflow-wrap:anywhere}
.tag{
  display:inline-block;
  font-size:.72rem;font-weight:700;letter-spacing:.04em;line-height:1.5;
  padding:0 .45rem;border-radius:4px;margin-right:.45rem;
  vertical-align:.1em;
}
.tag.deadline{background:var(--warn-soft);color:var(--warn)}
.tag.caution{background:var(--caution-soft);color:var(--caution)}
.note{display:block;margin-top:.15rem;font-size:.88rem;color:var(--muted)}
.dt{display:block;margin-top:.2rem;font-size:.9rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.when{margin:0 0 .35rem;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.birth{
  display:inline-block;margin:0 0 .7rem;padding:.15rem .75rem;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);
  font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;
}
.links{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin-top:.35rem;font-size:.9rem}
.links a{color:var(--accent);text-underline-offset:.2em}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

.org{display:grid;gap:.05rem;padding:.6rem .6rem}
.org strong{font-weight:700}
.org span{color:var(--muted);font-size:.9rem}
.org a{color:var(--accent);font-size:.9rem;text-underline-offset:.2em;overflow-wrap:anywhere}

.foot{border-top:1px solid var(--line);padding-block:1.2rem 0;color:var(--muted);font-size:.9rem}
.foot p{margin:0 0 1rem;max-width:38rem}
.btn{
  font:inherit;font-size:.9rem;
  min-height:40px;padding:.4rem 1rem;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:8px;cursor:pointer;
}
.btn.confirm{border-color:var(--warn);color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:560px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .age{flex-direction:row;align-items:baseline;gap:.4rem;margin-bottom:.35rem}
  .unit{margin-top:0}
  .big.long{padding-top:0}
}
</style>

    {
      big: ['상시', '隨時'], unit: ['', ''],
      title: ['항상 기억할 것', '隨時留意'],
      items: [
        { id: 'g1', v: 'all', tag: 'caution',
          t: ['대만 공항에서는 대만 여권, 한국 공항에서는 한국 여권을 사용한다',
              '在台灣機場用台灣護照，在韓國機場用韓國護照'] },
        { id: 'g2', v: 'all', tag: 'caution',
          t: ['한국에서 대만 여권을 쓰면 대만 관광객 신분이 되어 체류가 30일로 제한된다',
              '若在韓國使用台灣護照，只有台灣觀光客身分，居留限30天'] },
        { id: 'g3', v: 'all',
          t: ['이중국적을 유지하면 앞으로 한국의 건강보험, 연금 등의 자격이 생긴다',
              '維持雙重國籍，日後在韓國的健保、年金等都有資格'] },
        { id: 'g4', v: 'all',
          t: ['나중에 자녀가 생기면 자녀도 한국 국적을 얻는다. 한국에 출생 등록을 하고 위와 같은 절차를 똑같이 처리한다',
              '將來有孩子，一樣獲得韓國國籍。要在韓國登記出生，並同樣處理上面的國籍聲明（男生另加兵役）'] }
      ]
    }
  ];

  var ORGS = [
    { v: 'all',
      name: ['법무부 출입국·외국인정책본부', '法務部 出入國・外國人政策本部'],
      role: ['국적선택신고', '國籍選擇申報'],
      href: 'https://www.immigration.go.kr', host: 'immigration.go.kr' },
    { v: 'all',
      name: ['외교부 재외공관', '外交部 在外公館'],
      role: ['해외출생신고, 한국 국적 이탈', '海外出生申報、脫離韓國國籍'],
      href: 'https://www.mofa.go.kr', host: 'mofa.go.kr' },
    { v: 'm',
      name: ['병무청', '兵務廳'],
      role: ['병역과 국적 관련 문의', '兵役相關國籍詢問'],
      href: 'https://www.mma.go.kr', host: 'mma.go.kr' }
  ];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function T(a) { return a[st.lang]; }
  function show(it) { return it.v === 'all' || it.v === st.ver; }
  function key(it) { return st.ver + ':' + it.id; }

  function updateProgress() {
    var total = 0, done = 0;
    STAGES.forEach(function (s) {
      s.items.forEach(function (it) {
        if (!show(it)) return;
        total++;
        if (st.c[key(it)]) done++;
      });
    });
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('prog').innerHTML =
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total +
      '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div>' +
      '<span>' + T(U.done) + ' ' + done + ' / ' + total + '</span>';
  }

  function renderList() {
    var html = '';
    STAGES.forEach(function (s) {
      var items = s.items.filter(show);
      if (!items.length) return;
      var big = typeof s.big === 'string' ? s.big : T(s.big);
      var unit = T(s.unit);
      html += '<section class="stage"><div class="age"><span class="big' + (s.long ? ' long' : '') + '">' +
        esc(big) + '</span>' + (unit ? '<span class="unit">' + esc(unit) + '</span>' : '') + '</div>' +
        '<div class="stage-body"><h2>' + esc(T(s.title)) + '</h2>' +
        (s.when && s.when[st.ver] ? '<p class="when">' + esc(T(s.when[st.ver])) + '</p>' : '') +
        '<ul class="items">';
      items.forEach(function (it) {
        var id = 'c-' + st.ver + '-' + it.id;
        var on = !!st.c[key(it)];
        var tag = it.tag === 'deadline'
          ? '<span class="tag deadline">' + esc(T(U.tagDeadline)) + '</span>'
          : it.tag === 'caution'
            ? '<span class="tag caution">' + esc(T(U.tagCaution)) + '</span>' : '';
        var note = it.n ? '<span class="note">' + esc(T(it.n)) + '</span>' : '';
        var dt = it.d && it.d[st.ver] ? '<span class="dt">' + esc(T(it.d[st.ver])) + '</span>' : '';
        var links = '';
        if (it.links) {
          links = '<div class="links">' + it.links.map(function (k) {
            return '<a href="' + esc(k.h) + '" target="_blank" rel="noopener noreferrer">' + esc(T(k.l)) + '</a>';
          }).join('') + '</div>';
        }
        html += '<li><label class="row' + (on ? ' done' : '') + '" for="' + id + '">' +
          '<input type="checkbox" id="' + id + '" data-k="' + esc(key(it)) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="txt">' + tag + esc(T(it.t)) + dt + note + links + '</span></label></li>';
      });
      html += '</ul></div></section>';
    });

    html += '<section class="stage"><div class="age"><span class="big">' + esc(T(U.orgBig)) +
      '</span></div><div class="stage-body"><h2>' + esc(T(U.orgTitle)) + '</h2><div class="items">';
    ORGS.filter(show).forEach(function (o) {
      html += '<div class="org"><strong>' + esc(T(o.name)) + '</strong><span>' + esc(T(o.role)) +
        '</span><a href="' + esc(o.href) + '" target="_blank" rel="noopener noreferrer">' + esc(o.host) + '</a></div>';
    });
    html += '</div></div></section>';

    document.getElementById('list').innerHTML = html;
  }

  var resetTimer = null, resetArmed = false;
  function renderFoot() {
    document.getElementById('foot').innerHTML =
      '<p>' + esc(T(U.foot)) + '</p>' +
      '<button type="button" class="btn' + (resetArmed ? ' confirm' : '') + '" id="resetBtn">' +
      esc(T(resetArmed ? U.resetConfirm : U.reset)) + '</button>';
  }

  function renderControls() {
    document.documentElement.lang = st.lang ? 'zh-Hant' : 'ko';
    var vb = document.querySelectorAll('#segVer button');
    for (var i = 0; i < vb.length; i++) {
      var b = vb[i];
      b.textContent = U.ver[st.lang][b.dataset.ver === 'm' ? 0 : 1];
      b.setAttribute('aria-pressed', String(b.dataset.ver === st.ver));
    }
    document.getElementById('segVer').setAttribute('aria-label', T(U.verLabel));
    var lb = document.querySelectorAll('#segLang button');
    for (var j = 0; j < lb.length; j++) {
      lb[j].setAttribute('aria-pressed', String(Number(lb[j].dataset.lang) === st.lang));
    }
    document.getElementById('h1').textContent = T(U.h1);
    document.getElementById('lead').textContent = T(U.lead);
    document.getElementById('birth').textContent = T(U.birth[st.ver]);
  }

  function renderAll() {
    renderControls();
    renderList();
    renderFoot();
    updateProgress();
  }

  // build the toggle buttons once so focus stays on them after a click
  var segVer = document.getElementById('segVer');
  ['m', 'f'].forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.ver = v;
    segVer.appendChild(b);
  });
  var segLang = document.getElementById('segLang');
  [['한국어', 0], ['繁體中文', 1]].forEach(function (x) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = String(x[1]);
    b.textContent = x[0];
    segLang.appendChild(b);
  });

  document.getElementById('top').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.ver) { st.ver = b.dataset.ver; }
    else if (b.dataset.lang) { st.lang = Number(b.dataset.lang); }
    else return;
    resetArmed = false;
    save();
    renderAll();
  });

  document.getElementById('list').addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb || cb.type !== 'checkbox') return;
    var k = cb.dataset.k;
    if (cb.checked) st.c[k] = 1; else delete st.c[k];
    var row = cb.closest('.row');
    if (row) row.classList.toggle('done', cb.checked);
    save();
    updateProgress();
  });

  document.getElementById('foot').addEventListener('click', function (e) {
    if (!e.target.closest('#resetBtn')) return;
    if (!resetArmed) {
      resetArmed = true;
      renderFoot();
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () { resetArmed = false; renderFoot(); }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    Object.keys(st.c).forEach(function (k) {
      if (k.indexOf(st.ver + ':') === 0) delete st.c[k];
    });
    save();
    renderAll();
  });

  renderAll();
})();
</script>

</body></html>
